# Builds the Mac app on an Apple Silicon Mac, tests it, and publishes it.
#   Dev:  every push to the dev branch -> "Whisperer Dev.app", published as a GitHub pre-release vX.Y.Z-dev.N
#         (only the dev app updates to these; the newest 5 are kept).
#   Prod: push a tag vX.Y.Z (VERSION in whisperer_core.py, a CHANGELOG.md section) -> "Whisperer.app", a normal
#         release that friends' apps update to.
#   Manual run (Actions -> Mac app -> Run workflow): dev on the dev branch, a prod build without release on main.
name: Mac app

on:
  push:
    branches: [dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write  # create releases

concurrency:  # a newer push to dev replaces a dev build that is still running
  group: mac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  build:
    # macos-14: pip picks MLX wheels for macOS 14, so the app runs on macOS 14 and newer
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags and history for the dev release notes

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Choose the release line
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            channel=prod; app="Whisperer"; asset="Whisperer-mac-arm64.zip"
          else
            channel=dev; app="Whisperer Dev"; asset="Whisperer-Dev-mac-arm64.zip"
          fi
          printf 'CHANNEL = "%s"\nBUILD = "%s"\n' "$channel" "$GITHUB_RUN_NUMBER" > whisperer_build.py
          version=$(python -c "import whisperer_core as c; print(c.APP_VERSION)")
          { echo "CHANNEL=$channel"; echo "APP=$app"; echo "ASSET=$asset"; echo "APP_VERSION=$version"; } >> "$GITHUB_ENV"
          echo "Building $app $version ($channel)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mac.txt pyinstaller
          python -m pip install --no-deps mlx-whisper==0.4.3
          python -c "import tkinter; tkinter.Tcl(); print('Tk', tkinter.TkVersion)"

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but VERSION in whisperer_core.py is $APP_VERSION"
            exit 1
          fi

      - name: Build the app
        run: |
          pyinstaller --noconfirm --clean whisperer.spec
          codesign --force --deep --sign - "dist/$APP.app"
          codesign --verify --deep --strict "dist/$APP.app"
          du -sh "dist/$APP.app"

      - name: Self-test - versions and a test transcription
        timeout-minutes: 20  # the self-test's own watchdog exits after 4 min (GPU) / 10 min (CPU)
        env:
          WHISPERER_MODEL: mlx-community/whisper-tiny-mlx  # small model, same code path as large-v3
          WHISPERER_DATA: ${{ runner.temp }}/data
          WHISPERER_SUPPORT: ${{ runner.temp }}/support
        run: |
          say -o "$RUNNER_TEMP/test.aiff" "This is a short test of the Whisperer app."
          app="dist/$APP.app/Contents/MacOS/Whisperer"
          if ! "$app" --self-test "$RUNNER_TEMP/test.aiff"; then
            echo "::warning::GPU run failed (CI machines often have no Metal GPU); retrying on the CPU"
            WHISPERER_MLX_DEVICE=cpu WHISPERER_SELFTEST_TIMEOUT=600 "$app" --self-test "$RUNNER_TEMP/test.aiff"
          fi

      - name: Self-test - a downloaded yt-dlp overrides the bundled one
        timeout-minutes: 10
        env:
          WHISPERER_SUPPORT: ${{ runner.temp }}/support
        run: |
          python -m pip download yt-dlp --no-deps --only-binary=:all: -d "$RUNNER_TEMP/ytdlp"
          mkdir -p "$WHISPERER_SUPPORT/packages"
          unzip -q "$RUNNER_TEMP"/ytdlp/*.whl 'yt_dlp/*' -d "$WHISPERER_SUPPORT/packages"
          "dist/$APP.app/Contents/MacOS/Whisperer" --self-test | tee "$RUNNER_TEMP/overlay.txt"
          grep -q "from $WHISPERER_SUPPORT/packages/yt_dlp" "$RUNNER_TEMP/overlay.txt"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent "$APP.app" "$ASSET"
          shasum -a 256 "$ASSET" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh "$ASSET"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}
            dist/SHA256SUMS.txt

      - name: Publish the dev pre-release
        if: env.CHANNEL == 'dev' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 50 --json tagName,isPrerelease \
                 --jq '[.[] | select(.isPrerelease and (.tagName | contains("-dev.")))][0].tagName // ""')
          {
            echo "Dev build $APP_VERSION (${GITHUB_SHA::7}) - for testing in Whisperer Dev; friends never get dev builds."
            echo
            if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
              echo "Changes since $prev:"
              git log --format='- %s' "$prev..$GITHUB_SHA"
            else
              git log -1 --format='- %s' "$GITHUB_SHA"
            fi
          } > notes.md
          cat notes.md
          gh release create "v$APP_VERSION" "dist/$ASSET" dist/SHA256SUMS.txt --prerelease \
            --target "$GITHUB_SHA" --title "Whisperer Dev $APP_VERSION" --notes-file notes.md
          # keep the newest 5 dev pre-releases (the list is newest first)
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | contains("-dev."))) | .tagName' \
            | tail -n +6 | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$APP_VERSION" 'index($0, "## " v) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "dist/$ASSET" dist/SHA256SUMS.txt \
            --title "Whisperer $APP_VERSION" --notes-file notes.md
