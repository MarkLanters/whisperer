# Builds Whisperer.app on an Apple Silicon Mac, tests it, and publishes a GitHub release for version tags.
#   Test build (no release): Actions tab -> "Mac app" -> Run workflow; download the artifact.
#   Release: set VERSION in whisperer_core.py, add a CHANGELOG.md section, then push a tag vX.Y.Z.
name: Mac app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # create releases

jobs:
  build:
    # macos-14: pip picks MLX wheels for macOS 14, so the app runs on macOS 14 and newer
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mac.txt pyinstaller
          python -m pip install --no-deps mlx-whisper==0.4.3
          python -c "import tkinter; tkinter.Tcl(); print('Tk', tkinter.TkVersion)"

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import whisperer_core as c; print(c.VERSION)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but VERSION in whisperer_core.py is $v"
            exit 1
          fi

      - name: Build Whisperer.app
        run: |
          pyinstaller --noconfirm --clean whisperer.spec
          codesign --force --deep --sign - dist/Whisperer.app
          codesign --verify --deep --strict dist/Whisperer.app
          du -sh dist/Whisperer.app

      - name: Self-test - versions and a test transcription
        timeout-minutes: 20  # the self-test's own watchdog exits after 4 min (GPU) / 10 min (CPU)
        env:
          WHISPERER_MODEL: mlx-community/whisper-tiny-mlx  # small model, same code path as large-v3
          WHISPERER_DATA: ${{ runner.temp }}/data
          WHISPERER_SUPPORT: ${{ runner.temp }}/support
        run: |
          say -o "$RUNNER_TEMP/test.aiff" "This is a short test of the Whisperer app."
          app=dist/Whisperer.app/Contents/MacOS/Whisperer
          if ! "$app" --self-test "$RUNNER_TEMP/test.aiff"; then
            echo "::warning::GPU run failed (CI machines often have no Metal GPU); retrying on the CPU"
            WHISPERER_MLX_DEVICE=cpu WHISPERER_SELFTEST_TIMEOUT=600 "$app" --self-test "$RUNNER_TEMP/test.aiff"
          fi

      - name: Self-test - a downloaded yt-dlp overrides the bundled one
        timeout-minutes: 10
        env:
          WHISPERER_SUPPORT: ${{ runner.temp }}/support
        run: |
          python -m pip download yt-dlp --no-deps --only-binary=:all: -d "$RUNNER_TEMP/ytdlp"
          mkdir -p "$WHISPERER_SUPPORT/packages"
          unzip -q "$RUNNER_TEMP"/ytdlp/*.whl 'yt_dlp/*' -d "$WHISPERER_SUPPORT/packages"
          dist/Whisperer.app/Contents/MacOS/Whisperer --self-test | tee "$RUNNER_TEMP/overlay.txt"
          grep -q "from $WHISPERER_SUPPORT/packages/yt_dlp" "$RUNNER_TEMP/overlay.txt"

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Whisperer.app Whisperer-mac-arm64.zip
          shasum -a 256 Whisperer-mac-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh Whisperer-mac-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Whisperer-mac-arm64
          path: |
            dist/Whisperer-mac-arm64.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/Whisperer-mac-arm64.zip dist/SHA256SUMS.txt \
            --title "Whisperer $v" --notes-file notes.md
